; 私域引流宝 Docker 环境专用 PHP 配置（conf.d 自动加载）
;
; output_buffering：项目的中转页（common/*/redirect/index.php）先输出 HTML、
; 后调用 header('Location:...') 做跳转。官方 php 镜像默认 output_buffering=0，
; 会报 "Cannot modify header information - headers already sent"。
; 开启输出缓冲与原作 environments（宝塔默认 4096）行为一致。
output_buffering = 4096
